services:
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - 5432:5432
    volumes:
      - rscore-postgres-data:/var/lib/postgresql/data      
    networks:
      - rscore-network
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=rscore
  
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - 5050:80
    depends_on:
      - postgres
    volumes:
      - ./servers.json:/pgadmin4/servers.json
    networks:
      - rscore-network
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@rscore.com
      - PGADMIN_DEFAULT_PASSWORD=123456

volumes:
  rscore-postgres-data:

networks:
  rscore-network:
    name: rscore-network
    driver: bridge